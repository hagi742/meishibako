<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>名刺箱を2.3へ更新</title><style>body{font:16px system-ui;max-width:560px;margin:40px auto;padding:20px;line-height:1.8;background:#f2f2f7;color:#222}button,a{padding:14px;background:#007aff;color:white;border:0;border-radius:10px;font:inherit}a{display:inline-block;text-decoration:none}pre{white-space:pre-wrap}button:disabled{opacity:.5}</style><h1>名刺箱を2.3へ更新</h1><p>古いオフラインファイルを新版に更新します。保存した名刺や写真は削除しません。</p><p>通信できる状態で更新してください。OCRデータも準備するため時間がかかります。</p><button id="update">更新を開始</button><pre id="status" role="status"></pre><a href="index.html" id="open" hidden>名刺箱を開く</a><script>
const button=document.getElementById('update'),status=document.getElementById('status');button.onclick=async()=>{button.disabled=true;status.textContent='更新を確認中…';try{
 if(!('serviceWorker'in navigator))throw Error('SafariでHTTPSのURLを開いてください');
 navigator.serviceWorker.addEventListener('message',e=>{if(e.data?.type==='MEISHIBAKO_CACHE_PROGRESS')status.textContent='必要なファイルを保存中… '+e.data.done+' / '+e.data.total;if(e.data?.type==='MEISHIBAKO_CACHE_ERROR'){status.textContent='更新に失敗：'+e.data.message;button.disabled=false}if(e.data?.type==='MEISHIBAKO_OFFLINE_READY_V22'){status.textContent='更新が完了しました。「名刺箱を開く」を押してください。';document.getElementById('open').hidden=false;button.disabled=false}});
 const check=()=>navigator.serviceWorker.controller?.postMessage({type:'MEISHIBAKO_CHECK_V22'});
 navigator.serviceWorker.addEventListener('controllerchange',check);
 const reg=await navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'});await reg.update();check();
 const watch=()=>{const worker=reg.installing;if(worker)worker.addEventListener('statechange',()=>{if(worker.state==='redundant'){status.textContent='更新に失敗しました。GitHubに全ファイルが配置されているか確認してください。';button.disabled=false}if(worker.state==='activated')check()})};reg.addEventListener('updatefound',watch);watch();
}catch(e){status.textContent='更新できません：'+e.message;button.disabled=false}};
</script></html>
